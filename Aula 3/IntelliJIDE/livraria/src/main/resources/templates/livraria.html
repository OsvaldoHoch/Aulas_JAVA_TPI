<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Livraria</title>
</head>
<style>
  body {
    font-family: Verdana;
    text-align: center;
    margin-top: 100px;
  }
  .dados {
    border: 1px solid #d0d0d0;
    padding: 20px 30px;
    border-radius: 10px;
  }
</style>
<body>
  <div class="dados">
    <h1>Dados do Livro</h1>
    <p>Nome do livro: <strong th:text="${nomeLivro}"></strong></p>
    <p>ISBN: <strong th:text="${ISBN}"></strong></p>
    <p>Páginas: <strong th:text="${paginas}"></strong></p>
    <p>Editora: <strong th:text="${editora}"></strong></p>
    <p>categoria: <strong th:text="${categoria}"></strong></p>
  </div>
</body>
</html>
