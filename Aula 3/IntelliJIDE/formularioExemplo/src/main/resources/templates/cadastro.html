<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Sistema de Cadastro de Produtos</title>
    <style>
        .formulario { margin-bottom: 15px; }
        label { display: block; font-weight: bold; }
        .resultado { background: #e7f3fe; padding: 15px; border-radius: 5px; margin-top: 20px; }
    </style>
</head>
<body>

<h2>Cadastrar Produto</h2>

<form th:action="@{/salvar-produto}" method="post">
    <div class="formulario">
        <label>Nome</label>
        <input type="text" name="nome" required placeholder="Escreva seu nome"/>
    </div>

    <div class="formulario">
        <label>Preço</label>
        <input type="number" step="0.01" name="preco" required />
    </div>

    <div class="formulario">
        <label>Categoria:</label>
        <select name="categoria">
            <option value="Eletronicos">Eletrônicos</option>
            <option value="Alimenticios">Alimentícios</option>
            <option value="Vestuarios">Vestuarios</option>
        </select>
    </div>

    <button type="submit">Cadastrar</button>
</form>

<div th:if="${sucesso}" class="resultado">
    <h3>Produtos</h3>
    <p><strong>Nome do Produto:</strong> <span th:text="${n}"></span></p>
    <p><strong>Preço do Produto:</strong> R$ <span th:text="${p}"></span></p>
    <p><strong>Categoria do Produto:</strong> <span th:text="${c}"></span></p>
</div>

</body>
</html>
