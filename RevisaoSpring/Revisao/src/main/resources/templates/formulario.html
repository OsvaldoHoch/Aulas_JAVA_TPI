<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>                     </title>
    <style>
        .formulario { margin-bottom: 15px; }
        label { display: block; font-weight: bold; }
        .resultado { background: #e7f3fe; padding: 15px; border-radius: 5px; margin-top: 20px; }
    </style>
</head>
<body>

<h2>Cadastro de Funcionário</h2>

<form th:action="@{/salvar}" method="post">
    <div class="formulario">
        <label>Nome</label>
        <input type="text" name="nome" required placeholder="Nome Funcionário" />
    </div>
    <div class="formulario">
        <label>Idade</label>
        <input type="number" name="idade" required />
    </div>
    <div class="formulario">
        <label>Altura</label>
        <input type="text" step="0.01" name="altura" required />
    </div>
    <div class="formulario">
        <label>Data de Nascimento</label>
        <input type="date" name="datanasc" required />
    </div>

    <div class="formulario">
        <label>Cargo:</label>
        <select name="cargo">
            <option value="Estagiário">Estagiário</option>
            <option value="Assistente Técnico">Assistente Técnico</option>
            <option value="Líder Técnico">Líder Técnico</option>
        </select>
    </div>

    <button type="submit">Cadastrar</button>
</form>

<div th:if="${sucesso}" class="resultado">
    <h3><strong>Funcionário: </strong> <span th:text="${n}"></span></h3>
    <p><strong>Idade: </strong> <span th:text="${i}"></span></p>
    <p><strong>Altura: </strong> R$ <span th:text="${a}"></span></p>
    <p><strong>Data de Nascimento: </strong> <span th:text="${d}"></span></p>
    <p><strong>Cargo: </strong> <span th:text="${c}"></span></p>
</div>

</body>
</html>
